# vi-uinput-ime-vni default configuration
# Copy to /etc/vi-uinput-ime-vni/config.toml

[general]
# Tone placement style: "new" (oà, uý) or "old" (òa, úy)
tone_style = "new"
# Enable Vietnamese VNI input when desktop layout `vi_uinput` is active
enabled_on_start = true
# Auto-pause to 100% PassThrough whenever GNOME/KDE switches away from `vi_uinput` (to US, IBus, Fcitx5...)
sync_desktop_layout = true
# Path to write current IME state ("VI" / "EN") for Waybar / Polybar / eww
state_file = "/run/vi-uinput-ime-vni/state"
# Path where custom XKB keymap is installed
xkb_keymap_path = "/etc/vi-uinput-ime/vn_virtual.xkb"
# UNIX socket path used by `--ipc-bridge` (user session -> systemd daemon)
ipc_socket_path = "/run/vi-uinput-ime-vni/ipc.sock"
# Optional keyboard include/exclude filters (substring match against device name or /dev/input/by-id/*)
device_include = []
device_exclude = []

[hotkey]
# Toggle shortcut:
# - "none" (recommended on GNOME/KDE): use desktop input-source switcher (Super+Space / Meta+Space) with zero IBus/Fcitx5 conflict
# - "ctrl+space" or "super+space": manual daemon toggle (useful on Hyprland/Sway standalone)
toggle = "none"

[delays]
# Fallback delay (ms) between synthetic uinput keystrokes when app is unknown
default_ms = 2
# Delay (ms) automatically applied to any XWayland surface when reported by IPC
xwayland_ms = 8

# Explicit per-application window class overrides (case-insensitive substring match)
[delays.apps]
foot = 0
alacritty = 1
kitty = 1
wezterm = 1
ghostty = 1
nautilus = 1
dolphin = 1
chromium = 4
google-chrome = 4
brave-browser = 4
firefox = 3
code = 5
code-oss = 5
codium = 5
discord = 5
slack = 5
obsidian = 4
steam = 8
jetbrains = 7
libreoffice = 6
