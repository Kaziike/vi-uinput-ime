[package]
name = "vi-uinput-ime-vni"
version = "0.1.0"
edition = "2021"
description = "Low-latency Linux Vietnamese VNI IME using evdev, uinput, Custom XKB (134 chars), Compositor IPC, and Strict Single-Queue FIFO."
license = "MIT"

[[bin]]
name = "vi-uinput-ime-vni"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
evdev = { version = "0.12", features = ["tokio"] }
inotify = { version = "0.10", default-features = false, features = ["stream"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13", optional = true }

[features]
default = ["x11"]
x11 = ["dep:x11rb"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
